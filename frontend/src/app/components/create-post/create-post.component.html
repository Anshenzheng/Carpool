<div class="page-header">
  <div class="container">
    <h1>发布拼车</h1>
    <p>发布您的拼车信息，寻找同行邻居</p>
  </div>
</div>

<div class="container">
  <div class="form-container card">
    <div *ngIf="errorMessage" class="alert alert-error">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="alert alert-success">
      {{ successMessage }}
    </div>

    <form [formGroup]="postForm" (ngSubmit)="onSubmit()">
      <div class="form-section">
        <h3>路线信息</h3>
        
        <div class="form-row">
          <div class="form-group">
            <label for="departure">出发地 *</label>
            <input 
              type="text" 
              id="departure" 
              formControlName="departure" 
              class="form-control"
              placeholder="例如：阳光花园小区"
            >
            <div *ngIf="postForm.get('departure')?.invalid && postForm.get('departure')?.touched" class="text-danger text-small">
              请输入出发地
            </div>
          </div>

          <div class="form-group">
            <label for="destination">目的地 *</label>
            <input 
              type="text" 
              id="destination" 
              formControlName="destination" 
              class="form-control"
              placeholder="例如：市中心地铁站"
            >
            <div *ngIf="postForm.get('destination')?.invalid && postForm.get('destination')?.touched" class="text-danger text-small">
              请输入目的地
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="departureTime">出发时间 *</label>
            <input 
              type="datetime-local" 
              id="departureTime" 
              formControlName="departureTime" 
              class="form-control"
              [min]="minDate"
            >
            <div *ngIf="postForm.get('departureTime')?.invalid && postForm.get('departureTime')?.touched" class="text-danger text-small">
              请选择出发时间
            </div>
          </div>

          <div class="form-group">
            <label for="seats">座位数 *</label>
            <input 
              type="number" 
              id="seats" 
              formControlName="seats" 
              class="form-control"
              min="1"
              placeholder="例如：4"
            >
            <div *ngIf="postForm.get('seats')?.invalid && postForm.get('seats')?.touched" class="text-danger text-small">
              请输入有效的座位数
            </div>
          </div>
        </div>
      </div>

      <div class="form-section">
        <h3>联系方式</h3>
        
        <div class="form-row">
          <div class="form-group">
            <label for="contactName">联系人姓名 *</label>
            <input 
              type="text" 
              id="contactName" 
              formControlName="contactName" 
              class="form-control"
              placeholder="请输入联系人姓名"
            >
            <div *ngIf="postForm.get('contactName')?.invalid && postForm.get('contactName')?.touched" class="text-danger text-small">
              请输入联系人姓名
            </div>
          </div>

          <div class="form-group">
            <label for="contactPhone">联系电话 *</label>
            <input 
              type="tel" 
              id="contactPhone" 
              formControlName="contactPhone" 
              class="form-control"
              placeholder="请输入手机号"
            >
            <div *ngIf="postForm.get('contactPhone')?.invalid && postForm.get('contactPhone')?.touched" class="text-danger text-small">
              请输入正确的手机号
            </div>
          </div>
        </div>
      </div>

      <div class="form-section">
        <h3>补充说明</h3>
        
        <div class="form-group">
          <label for="description">备注说明 (可选)</label>
          <textarea 
            id="description" 
            formControlName="description" 
            class="form-control"
            rows="4"
            placeholder="请输入其他补充说明，如：可携带行李、需要拼车者准时到达等..."
          ></textarea>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="postForm.reset()">重置</button>
        <button 
          type="submit" 
          class="btn btn-primary"
          [disabled]="loading || postForm.invalid"
        >
          <span *ngIf="!loading">发布拼车</span>
          <span *ngIf="loading" class="loading-inline">
            <span class="spinner-small"></span> 发布中...
          </span>
        </button>
      </div>
    </form>
  </div>
</div>
