<div class="page-header">
  <div class="container">
    <h1>我的申请</h1>
    <p>查看和管理您的拼车申请</p>
  </div>
</div>

<div class="container">
  <div *ngIf="loading" class="loading">
    <div class="spinner"></div>
  </div>

  <div *ngIf="!loading && errorMessage" class="alert alert-error">
    {{ errorMessage }}
  </div>

  <div *ngIf="!loading && applications.length === 0" class="empty-state">
    <div class="empty-icon">📋</div>
    <h3>暂无拼车申请</h3>
    <p>您还没有申请任何拼车</p>
    <a routerLink="/carpool" class="btn btn-primary">浏览拼车</a>
  </div>

  <div *ngIf="!loading && applications.length > 0" class="applications-list">
    <div *ngFor="let app of applications" class="application-item card">
      <div class="application-main">
        <div class="route">
          <span class="location">{{ app.post.departure }}</span>
          <span class="arrow">→</span>
          <span class="location">{{ app.post.destination }}</span>
        </div>
        <div class="application-details">
          <span class="detail-item">
            <span class="detail-icon">⏰</span>
            出发时间: {{ formatDateTime(app.post.departureTime) }}
          </span>
          <span class="detail-item">
            <span class="detail-icon">👥</span>
            申请人数: {{ app.passengers }} 人
          </span>
          <span class="detail-item">
            <span class="badge" [ngClass]="getStatusBadgeClass(app.status)">
              {{ getStatusText(app.status) }}
            </span>
          </span>
        </div>
        <div *ngIf="app.rejectReason" class="reject-reason">
          <strong>拒绝原因：</strong>{{ app.rejectReason }}
        </div>
      </div>
      <div class="application-actions">
        <button 
          *ngIf="canCancel(app)" 
          class="btn btn-danger btn-small"
          (click)="cancelApplication(app)"
        >
          取消申请
        </button>
        <span 
          *ngIf="!canCancel(app) && (app.status === 0 || app.status === 1)" 
          class="text-light text-small"
          title="出发前30分钟内无法取消"
        >
          无法取消
        </span>
      </div>
    </div>
  </div>
</div>
