<div class="page-header">
  <div class="container">
    <h1>用户登录</h1>
    <p>欢迎回来，登录您的账户</p>
  </div>
</div>

<div class="container">
  <div class="auth-container">
    <div class="card">
      <div class="form-header">
        <h2>登录账户</h2>
        <p>输入您的用户名和密码</p>
      </div>

      <div *ngIf="errorMessage" class="alert alert-error">
        {{ errorMessage }}
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="username">用户名</label>
          <input 
            type="text" 
            id="username" 
            formControlName="username" 
            class="form-control"
            placeholder="请输入用户名"
          >
          <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" class="text-danger text-small">
            请输入用户名
          </div>
        </div>

        <div class="form-group">
          <label for="password">密码</label>
          <input 
            type="password" 
            id="password" 
            formControlName="password" 
            class="form-control"
            placeholder="请输入密码"
          >
          <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="text-danger text-small">
            请输入密码
          </div>
        </div>

        <button 
          type="submit" 
          class="btn btn-primary btn-full"
          [disabled]="loading || loginForm.invalid"
        >
          <span *ngIf="!loading">登录</span>
          <span *ngIf="loading" class="loading-inline">
            <span class="spinner-small"></span> 登录中...
          </span>
        </button>
      </form>

      <div class="form-footer">
        <p>还没有账户？<a routerLink="/register">立即注册</a></p>
      </div>
    </div>

    <div class="test-accounts">
      <div class="card">
        <h3>测试账户</h3>
        <div class="account-item">
          <p class="account-title">管理员账户</p>
          <p>用户名: admin</p>
          <p>密码: admin123</p>
        </div>
        <div class="account-item">
          <p class="account-title">普通用户</p>
          <p>请先注册账户</p>
        </div>
      </div>
    </div>
  </div>
</div>
